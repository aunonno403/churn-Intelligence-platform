[project]
name = "churn-intelligence"
version = "0.1.0"
description = "Churn prediction, explainability, and uplift-based targeting with decision economics."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic-settings>=2.5",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=2.17",
    "matplotlib>=3.9",
    "kaggle>=1.6",
    "py7zr>=0.22",
]

[project.scripts]
churn = "churn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
